name: Build OminX installable ISO

on:
  push:
    branches:
      - "arena/30b7965b-ominx-linux"
    paths:
      - ".github/workflows/build-iso.yml"
      - "Makefile"
      - "README.md"
      - "auto/**"
      - "build.sh"
      - "config/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build amd64 live installer
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out OminX
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune --all --force || true
          fi
          df -h /

      - name: Validate OminX configuration
        run: |
          make check
          node --check config/includes.chroot/usr/share/cinnamon/applets/ominx-start@ominx/applet.js

      - name: Smoke-test OminX GTK apps in Debian 13
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${GITHUB_WORKSPACE}/config/includes.chroot/usr/lib/ominx:/usr/lib/ominx:ro" \
            --volume "${GITHUB_WORKSPACE}/config/includes.chroot/usr/share/ominx:/usr/share/ominx:ro" \
            --volume "${GITHUB_WORKSPACE}/config/includes.chroot/usr/share/icons/hicolor:/usr/share/icons/hicolor:ro" \
            --volume "${GITHUB_WORKSPACE}/config/includes.chroot/usr/share/themes/OminX:/usr/share/themes/OminX:ro" \
            --volume "${GITHUB_WORKSPACE}/config/includes.chroot/usr/local/bin/ominx-store:/usr/local/bin/ominx-store:ro" \
            --volume "${GITHUB_WORKSPACE}/config/includes.chroot/usr/local/bin/ominx-settings:/usr/local/bin/ominx-settings:ro" \
            debian:trixie \
            sh -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                python3-gi gir1.2-gtk-3.0 xvfb xauth \
                adwaita-icon-theme hicolor-icon-theme fonts-noto-core librsvg2-common
              xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
                env GTK_THEME=OminX GDK_BACKEND=x11 \
                /usr/bin/python3 /workspace/scripts/smoke-gtk-apps.py
            '

      - name: Stamp source revision into the image
        run: |
          mkdir -p config/includes.chroot/usr/share/doc/ominx
          cat > config/includes.chroot/usr/share/doc/ominx/build-info.txt <<EOF
          OminX automated ISO build
          Source commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Workflow run: ${GITHUB_RUN_ID}
          Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Build ISO in a Debian 13 container
        run: |
          set -o pipefail
          docker run --privileged --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            debian:trixie \
            sh -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools dosfstools mtools \
                grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common \
                syslinux-utils debian-archive-keyring
              ./build.sh
            ' 2>&1 | tee live-build.log

      - name: Summarize image build failure
        if: failure()
        run: |
          if [[ ! -s live-build.log ]]; then
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          lines = Path("live-build.log").read_text(errors="replace").splitlines()
          print("## OminX image build log tail")
          print("```text")
          print("\n".join(lines[-60:]))
          print("```")
          PY
          MESSAGE="$(python3 - <<'PY'
          from pathlib import Path
          lines = Path("live-build.log").read_text(errors="replace").splitlines()
          print(" | ".join(lines[-18:])[:3000])
          PY
          )"
          MESSAGE="${MESSAGE//'%'/'%25'}"
          MESSAGE="${MESSAGE//$'\r'/'%0D'}"
          MESSAGE="${MESSAGE//$'\n'/'%0A'}"
          echo "::error file=live-build.log,line=1,title=ISO build log::$MESSAGE"

      - name: Verify ISO and write build summary
        run: |
          test -s live-image-amd64.hybrid.iso
          sha256sum -c SHA256SUMS
          echo "## OminX installable ISO" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: Debian 13 Trixie amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h live-image-amd64.hybrid.iso | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $(cut -d ' ' -f1 SHA256SUMS)" >> "$GITHUB_STEP_SUMMARY"
          echo "The ISO is available as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable ISO
        uses: actions/upload-artifact@v4
        with:
          name: OminX-installable-ISO-${{ github.sha }}
          path: |
            live-image-amd64.hybrid.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
