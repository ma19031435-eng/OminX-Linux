name: Boot OminX ISO preview

on:
  push:
    branches:
      - "arena/30b7965b-ominx-linux"
    paths:
      - ".github/workflows/preview-iso.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build-iso run ID containing the ISO artifact
        required: true
        type: string
        default: "39033489231"

permissions:
  actions: read
  contents: read

jobs:
  boot-preview:
    name: Boot live desktop and capture preview
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Download the installable ISO artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id || '39033489231' }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: preview-artifacts

      - name: Install emulator and VNC screenshot tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 seabios
          python3 -m venv "$RUNNER_TEMP/vnc-venv"
          "$RUNNER_TEMP/vnc-venv/bin/pip" install --disable-pip-version-check vncdotool

      - name: Boot the ISO and capture its desktop
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          ISO="$(find preview-artifacts -type f -name 'live-image-amd64.hybrid.iso' -print -quit)"
          test -n "$ISO"
          (cd "$(dirname "$ISO")" && sha256sum -c SHA256SUMS)

          SERIAL_LOG="$RUNNER_TEMP/ominx-serial.log"
          QEMU_LOG="$RUNNER_TEMP/ominx-qemu.log"
          qemu-system-x86_64 \
            -name ominx-live-preview \
            -machine pc \
            -accel tcg,thread=multi \
            -cpu max \
            -smp 2 \
            -m 4096 \
            -cdrom "$ISO" \
            -boot order=d,menu=on \
            -vga std \
            -display vnc=127.0.0.1:0 \
            -nic none \
            -serial "file:$SERIAL_LOG" \
            -monitor none \
            -no-reboot -no-shutdown \
            >"$QEMU_LOG" 2>&1 &
          QEMU_PID=$!
          trap 'kill "$QEMU_PID" 2>/dev/null || true; wait "$QEMU_PID" 2>/dev/null || true' EXIT

          # VNC is reachable before BIOS/GRUB have painted a menu. Wait long
          # enough for the ISO boot menu, then launch its default Live system entry.
          sleep 45
          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            cat "$QEMU_LOG"
            exit 1
          fi
          "$RUNNER_TEMP/vnc-venv/bin/vncdo" -s 127.0.0.1::5900 key enter

          # TCG is software emulation, so allow extra time for Cinnamon to start.
          sleep 360
          "$RUNNER_TEMP/vnc-venv/bin/vncdo" -s 127.0.0.1::5900 capture ominx-boot-preview.png
          "$RUNNER_TEMP/vnc-venv/bin/python" - <<'PY'
          from PIL import Image, ImageStat
          image = Image.open("ominx-boot-preview.png").convert("RGB")
          mean = sum(ImageStat.Stat(image).mean) / 3
          print(f"Captured {image.width}x{image.height} preview; mean brightness {mean:.1f}/255")
          image.save("ominx-boot-preview.jpg", "JPEG", quality=65, optimize=True)
          PY
          cp "$SERIAL_LOG" ominx-serial.log 2>/dev/null || true
          cp "$QEMU_LOG" ominx-qemu.log 2>/dev/null || true

      - name: Upload preview and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OminX-boot-preview-${{ github.run_id }}
          path: |
            ominx-boot-preview.jpg
            ominx-boot-preview.png
            ominx-serial.log
            ominx-qemu.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
