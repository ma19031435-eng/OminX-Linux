name: Source-built target Qt graphics
on:
  push:
    branches: [arena/11b46bb0-ominx-linux]
    paths: ['desktop/qt/**', 'desktop/probe/**', 'scripts/build-qt-target.sh', 'scripts/test-qt-target.py', '.github/workflows/qt-target.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  target-qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 pkg-config autoconf automake libtool texinfo nasm mtools xorriso qemu-system-x86 ovmf e2fsprogs
      - uses: actions/cache/restore@v4
        id: compiler
        with:
          path: |
            build/toolchain
            build/provenance
          key: source-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/**', 'scripts/build-toolchain.sh') }}
      - name: Build source toolchain when absent
        if: steps.compiler.outputs.cache-hit != 'true'
        run: JOBS=4 make toolchain
      - name: Cross-build target Qt and original probe
        run: JOBS=4 scripts/build-qt-target.sh 2>&1 | tee build/qt-target.log
      - name: Require accepted source-built kernel provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/39478002962 > build/source-run.json
          python3 - <<'PY'
          import json
          r = json.load(open('build/source-run.json'))
          assert r['conclusion'] == 'success', 'Source kernel acceptance must pass before Qt guest tests'
          assert r['head_sha'] == 'c8cbc84361c949858e952bd92e0147dec9a94341'
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 39478002962
          name: OminX-x86-c8cbc84361c949858e952bd92e0147dec9a94341
          path: build/source-core
          github-token: ${{ github.token }}
      - name: Package independent target graphics test media
        run: |
          (cd build/source-core && sha256sum -c SHA256SUMS)
          cp build/source-core/bzImage build/bzImage
          cp build/source-core/provenance/kernel.config build/provenance/kernel.config
          make initramfs
          python3 scripts/make-initramfs.py build/ominx build/initramfs.cpio.gz build/ominx-files build/ominx-control build/graphics-probe/ominx-graphics-probe
          JOBS=4 scripts/build-media.sh
      - name: Verify Qt on real BIOS and UEFI media
        run: python3 scripts/test-qt-target.py 2>&1 | tee build/qt-guest.log
      - name: Publish bounded diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('build/qt-target.log'), Path('build/qt-guest.log'), Path('build/acceptance/qt-target.json')]
          paths += sorted(Path('build/acceptance').glob('qt-*.txt'))
          for p in paths:
              if p.exists():
                  text = '\n'.join(p.read_text(errors='replace').splitlines()[-80:])
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={p.name}::{text}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OminX-target-Qt-development-${{ github.sha }}
          retention-days: 14
          path: |
            build/qt-target.log
            build/qt-guest.log
            build/provenance
            build/source-run.json
            build/acceptance/qt-*
            build/graphics-probe/ominx-graphics-probe
