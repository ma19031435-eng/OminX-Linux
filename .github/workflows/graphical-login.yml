name: Source-built graphical login
on:
  push:
    branches: [arena/11b46bb0-ominx-linux]
    paths: ['src/login/**', 'src/core/ominx.c', 'src/lib/**', 'desktop/desktop-shell/**', 'desktop/sddm/ominx/**', 'desktop/qt/**', 'scripts/build-desktop-shell.sh', 'scripts/build-qt-target.sh', 'scripts/build-qt-quick-target.sh', 'scripts/make-initramfs.py', 'scripts/ominx-hash.py', 'scripts/test-graphical-login.py', 'tests/test_login.py', 'Makefile', '.github/workflows/graphical-login.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  login:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-pil pkg-config autoconf automake libtool texinfo nasm mtools xorriso qemu-system-x86 ovmf e2fsprogs
      - uses: actions/cache/restore@v4
        id: compiler
        with:
          path: |
            build/toolchain
            build/provenance
          key: source-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/**', 'scripts/build-toolchain.sh') }}
      - name: Build source toolchain when absent
        if: steps.compiler.outputs.cache-hit != 'true'
        run: JOBS=4 make toolchain
      - uses: actions/cache/restore@v4
        id: quick-cache
        with:
          path: |
            build/qt-host
            build/qt-target
            build/qt-prefix
            build/qt-quick-host
            build/sources/qtbase
            build/sources/qtshadertools
            build/sources/qtdeclarative
            build/qtshadertools-host
            build/qtshadertools-target
            build/qtdeclarative-host-full
            build/qtdeclarative-target
          key: target-quick-${{ runner.os }}-${{ hashFiles('desktop/qt/**', 'toolchain/**') }}-${{ hashFiles('scripts/build-qt-target.sh', 'scripts/build-qt-quick-target.sh') }}
          restore-keys: |
            target-quick-${{ runner.os }}-${{ hashFiles('desktop/qt/**', 'toolchain/**') }}-
      - name: Source-build target Qt and Qt Quick dependencies
        run: |
          JOBS=4 scripts/build-qt-target.sh 2>&1 | tee build/qt-target.log
          JOBS=4 scripts/build-qt-quick-target.sh --dependencies-only 2>&1 | tee build/qt-quick-build.log
      - uses: actions/cache/save@v4
        if: always() && steps.quick-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/qt-host
            build/qt-target
            build/qt-prefix
            build/qt-quick-host
            build/sources/qtbase
            build/sources/qtshadertools
            build/sources/qtdeclarative
            build/qtshadertools-host
            build/qtshadertools-target
            build/qtdeclarative-host-full
            build/qtdeclarative-target
          key: ${{ steps.quick-cache.outputs.cache-primary-key }}
      - name: Build the original login service and desktop shell
        run: JOBS=4 scripts/build-desktop-shell.sh 2>&1 | tee build/desktop-shell.log
      - name: Require accepted source-built kernel provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 39564535782 --interval 60 --exit-status
          gh api repos/${{ github.repository }}/actions/runs/39564535782 > build/source-run.json
          python3 - <<'PY'
          import json
          r = json.load(open('build/source-run.json'))
          assert r['conclusion'] == 'success', 'Source core acceptance must pass before login guest tests'
          assert r['head_sha'] == '29ee23893c055263aa46fb68e701102d9005eb44'
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 39564535782
          name: OminX-x86-29ee23893c055263aa46fb68e701102d9005eb44
          path: build/source-core
          github-token: ${{ github.token }}
      - name: Package graphical login media and run target regressions
        run: |
          (cd build/source-core && sha256sum -c SHA256SUMS)
          cp build/source-core/bzImage build/bzImage
          cp build/source-core/provenance/kernel.config build/provenance/kernel.config
          make target-check 2>&1 | tee build/login-userspace.log
          python3 scripts/make-initramfs.py build/ominx build/initramfs.cpio.gz build/ominx-files build/ominx-control --login-dir build/login --login-accounts build/login/accounts
          JOBS=4 scripts/build-media.sh
      - name: Verify graphical login in real BIOS, UEFI and recovery guests
        run: python3 scripts/test-graphical-login.py 2>&1 | tee build/login-guest.log
      - name: Publish bounded diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('build/desktop-shell.log'), Path('build/login-userspace.log'), Path('build/login-guest.log'), Path('build/acceptance/graphical-login.json')]
          paths += sorted(Path('build/acceptance').glob('login-*.txt'))
          for p in paths:
              if p.exists():
                  text = '\n'.join(line[:150] for line in p.read_text(errors='replace').splitlines()[-25:])
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={p.name}::{text}')
          for name in ('desktop-shell', 'login-guest'):
              log = Path('build/%s.log' % name)
              if not log.exists():
                  continue
              lines = log.read_text(errors='replace').splitlines()
              hits = [i for i, line in enumerate(lines) if re.search(r'error:|FAILED:|CMake Error|Traceback|AssertionError|FAIL login|FAIL login-', line, re.I)]
              selected = sorted({j for i in hits[:6] for j in range(max(0, i-3), min(len(lines), i+22))})
              text = '\n'.join(lines[i].replace(str(Path.cwd()), '<repo>') for i in selected)[:16000]
              if text:
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={name}-first-errors::{text}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OminX-graphical-login-${{ github.sha }}
          retention-days: 14
          path: |
            build/login
            build/desktop-shell.log
            build/qt-target.log
            build/qt-quick-build.log
            build/login-userspace.log
            build/login-guest.log
            build/provenance
            build/source-run.json
            build/acceptance/graphical-login.json
            build/acceptance/login-*
