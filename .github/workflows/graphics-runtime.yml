name: Source-built shared graphics runtime
on:
  push:
    branches: [arena/11b46bb0-ominx-linux]
    paths: ['desktop/graphics/**', 'src/graphics/**', 'scripts/build-graphics-runtime.sh', 'scripts/stage-graphics-runtime.py', 'scripts/runtime-elf.py', 'scripts/test-graphics-runtime.py', 'scripts/fetch-archive.py', 'scripts/make-initramfs.py', 'tests/test_runtime_elf.py', '.github/workflows/graphics-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  bus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-venv pkg-config autoconf automake libtool texinfo nasm mtools xorriso qemu-system-x86 ovmf e2fsprogs flex bison gettext x11-xkb-utils
          mkdir -p build
          python3 -m venv build/meson-env
          build/meson-env/bin/pip install meson==1.9.1 Mako==1.3.10 PyYAML==6.0.3 packaging==25.0
      - uses: actions/cache/restore@v4
        id: compiler
        with:
          path: |
            build/toolchain
            build/provenance
          key: source-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/**', 'scripts/build-toolchain.sh') }}
      - name: Build source toolchain if missing
        if: steps.compiler.outputs.cache-hit != 'true'
        run: JOBS=4 make toolchain
      - name: Build source shared graphics SDK and audited runtime
        run: |
          export PATH="$PWD/build/meson-env/bin:$PATH"
          MESON="$PWD/build/meson-env/bin/meson" JOBS=4 scripts/build-graphics-runtime.sh 2>&1 | tee build/graphics-runtime-build.log
      - name: Require accepted source kernel provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/39564535782 > build/source-run.json
          python3 - <<'PY'
          import json
          r = json.load(open('build/source-run.json'))
          assert r['conclusion'] == 'success'
          assert r['head_sha'] == '29ee23893c055263aa46fb68e701102d9005eb44'
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 39564535782
          name: OminX-x86-29ee23893c055263aa46fb68e701102d9005eb44
          path: build/source-core
          github-token: ${{ github.token }}
      - name: Package source-built service media and run target regressions
        run: |
          (cd build/source-core && sha256sum -c SHA256SUMS)
          cp build/source-core/bzImage build/bzImage
          cp build/source-core/provenance/kernel.config build/provenance/kernel.config
          make target-check 2>&1 | tee build/graphics-runtime-userspace.log
          python3 scripts/make-initramfs.py build/ominx build/initramfs.cpio.gz build/ominx-files build/ominx-control --runtime-dir build/graphics-runtime
          JOBS=4 scripts/build-media.sh
      - name: Verify shared libraries and real software rendering in guests
        run: python3 scripts/test-graphics-runtime.py 2>&1 | tee build/graphics-runtime-guest.log
      - name: Publish bounded diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('build/graphics-runtime-build.log'), Path('build/graphics-runtime-userspace.log'), Path('build/graphics-runtime-guest.log'), Path('build/acceptance/graphics-runtime.json')]
          paths += sorted(Path('build/acceptance').glob('runtime-*.txt'))
          for p in paths:
              if p.exists():
                  text = '\n'.join(line[:150] for line in p.read_text(errors='replace').splitlines()[-25:])
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={p.name}::{text}')
          log = Path('build/graphics-runtime-build.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              hits = [i for i, line in enumerate(lines) if re.search(r'error:|FAILED:|AutoMoc subprocess error|CMake Error|predefines generation failed', line, re.I)]
              selected = sorted({j for i in hits[:4] for j in range(max(0, i-3), min(len(lines), i+24))})
              text = '\n'.join(lines[i].replace(str(Path.cwd()), '<repo>') for i in selected)[:16000]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=graphics-runtime-first-errors::{text}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OminX-shared-graphics-development-${{ github.sha }}
          retention-days: 14
          path: |
            build/graphics-runtime
            build/graphics-sources
            build/graphics-runtime-*.log
            build/provenance
            build/source-run.json
            build/acceptance/graphics-runtime.json
            build/acceptance/runtime-*.txt
