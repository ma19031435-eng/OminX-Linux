name: Source-built Wine/Proton runtime
# Manual only: a from-source glibc + Wine + DXVK build takes hours and the
# result changes only when compat/ pins change. The artifact feeds
# make-initramfs --wine-runtime-dir build/wine-runtime; see
# docs/windows-compatibility.md.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel build jobs
        default: '4'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Install build-host tools (never shipped in the image)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            python3 python3-venv autoconf automake libtool texinfo nasm flex bison gperf \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-x86-64 g++-mingw-w64-i686 \
            patchelf gettext
          mkdir -p build
          python3 -m venv build/meson-env
          build/meson-env/bin/pip install meson==1.7.2
      - uses: actions/cache/restore@v4
        id: sources
        with:
          path: |
            build/sources/wine-rt
            build/wine-rt/stamps
            build/wine-rt/stage
          key: wine-runtime-${{ runner.os }}-${{ hashFiles('compat/sources.env', 'compat/sources.json', 'scripts/build-wine-runtime.sh') }}
      - name: Build glibc, Wine (WoW64), DXVK and vkd3d-proton from pinned source
        run: MESON="$PWD/build/meson-env/bin/meson" JOBS="${{ inputs.jobs }}" scripts/build-wine-runtime.sh 2>&1 | tee build/wine-runtime-build.log
      - uses: actions/cache/save@v4
        if: steps.sources.outputs.cache-hit != 'true'
        with:
          path: |
            build/sources/wine-rt
            build/wine-rt/stamps
            build/wine-rt/stage
          key: ${{ steps.sources.outputs.cache-primary-key }}
      - name: Audit is part of the build script; show the result
        run: |
          cat build/wine-runtime/VERSION
          du -sh build/wine-runtime
          head -20 build/provenance/wine-runtime.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OminX-wine-runtime-${{ github.sha }}
          path: |
            build/wine-runtime
            build/provenance/wine-runtime.sha256
            build/provenance/sources.env
          retention-days: 30
