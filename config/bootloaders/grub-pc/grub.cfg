# OminX Aurora live and installer menu.
source /boot/grub/config.cfg

set default=0
set timeout=8
set timeout_style=menu
set gfxmode=auto
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

if [ -f /boot/grub/splash.png ]; then
    background_image /boot/grub/splash.png
fi

set color_normal=light-gray/black
set color_highlight=black/light-cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

menuentry "Try OminX Aurora" --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux KERNEL_LIVE APPEND_LIVE
    initrd INITRD_LIVE
}

menuentry "Install OminX (graphical)" --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux KERNEL_GI APPEND_GI
    initrd INITRD_GI
}

submenu "Advanced options" --class gnu-linux {
    menuentry "OminX Aurora (safe graphics)" --class gnu-linux --class gnu --class os {
        set gfxpayload=keep
        linux KERNEL_LIVE APPEND_LIVE_FAILSAFE
        initrd INITRD_LIVE
    }

    LINUX_INSTALL
    LINUX_ADVANCED_INSTALL
    MEMTEST
}
