timeout: 3
serial: yes

/OminX terminal
    protocol: linux
    path: boot():/boot/bzImage
    module_path: boot():/boot/initramfs.cpio.gz
    cmdline: console=tty0 console=ttyS0,115200 rdinit=/init panic=-1
    resolution: 1024x768x32

/OminX recovery - ROOT console (no authentication)
    protocol: linux
    path: boot():/boot/bzImage
    module_path: boot():/boot/initramfs.cpio.gz
    cmdline: console=tty0 console=ttyS0,115200 rdinit=/init panic=-1 ominx.recovery=1
    resolution: 1024x768x32
