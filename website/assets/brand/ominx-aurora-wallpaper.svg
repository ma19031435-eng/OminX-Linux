<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-label="Original OminX Aurora wallpaper, with a luminous OminX mark in a deep teal and indigo sky">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111a"/>
      <stop offset=".52" stop-color="#0b1725"/>
      <stop offset="1" stop-color="#17182e"/>
    </linearGradient>
    <radialGradient id="aurora" cx="76%" cy="45%" r="66%">
      <stop offset="0" stop-color="#41dbc6" stop-opacity=".24"/>
      <stop offset=".28" stop-color="#348fd5" stop-opacity=".20"/>
      <stop offset=".62" stop-color="#6461bf" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0b1725" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3de0ca" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#3de0ca" stop-opacity=".09"/>
      <stop offset="1" stop-color="#3de0ca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9276ef" stop-opacity=".19"/>
      <stop offset=".6" stop-color="#9276ef" stop-opacity=".06"/>
      <stop offset="1" stop-color="#9276ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="markAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#47dbc9" stop-opacity=".22"/>
      <stop offset=".52" stop-color="#418fdf" stop-opacity=".12"/>
      <stop offset="1" stop-color="#418fdf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1=".08" y1=".06" x2=".92" y2=".94">
      <stop offset="0" stop-color="#9bf1e4"/>
      <stop offset=".43" stop-color="#44d5ce"/>
      <stop offset=".72" stop-color="#4ca8f2"/>
      <stop offset="1" stop-color="#9a83ef"/>
    </linearGradient>
    <linearGradient id="markSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e6d8" stop-opacity=".58"/>
      <stop offset="1" stop-color="#8f86f2" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#effbfd"/>
      <stop offset="1" stop-color="#b9dbe4"/>
